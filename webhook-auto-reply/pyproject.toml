[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wirebox-webhook-auto-reply"
version = "0.1.0"
description = "Autonomous inbound email webhook receiver and auto-reply agent in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "wirebox>=0.1.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
webhook-auto-reply = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
wirebox = { path = "../../wirebox-python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
