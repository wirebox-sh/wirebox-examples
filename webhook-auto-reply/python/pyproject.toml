[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wirebox-webhook-auto-reply-python"
version = "0.1.0"
description = "End-to-end inbound email webhook example with Wirebox Tunnel, HMAC verification, and auto-reply in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "wirebox>=0.1.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
wirebox = { path = "../../../../wirebox-python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]


