[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wirebox-browser-use"
version = "0.1.0"
description = "Autonomous browser automation with Wirebox email inboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "browser-use>=0.1.30",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
]

[project.scripts]
wirebox-browser-use = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
